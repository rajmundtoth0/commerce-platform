# ArgoCD Application: deploys the Helm chart and keeps the cluster in sync with git.
# Apply into the argocd namespace:  kubectl apply -n argocd -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/commerce-platform.git
    targetRevision: main
    path: deploy/helm/commerce-platform
    helm:
      releaseName: commerce
      # Override chart defaults for this environment. In a real setup these would
      # live in a values file per environment (values-prod.yaml) or be managed by
      # an image-updater that bumps image.tag on each release.
      valuesObject:
        replicaCount: 3
        image:
          repository: ghcr.io/your-org/commerce-platform
          tag: "0.1.0"
        env:
          APP_ENV: production
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
        postgres:
          host: postgres.data
          database: commerce
          user: commerce
          existingSecret: commerce-postgres
          existingSecretPasswordKey: password
        redis:
          url: redis://redis.data:6379/0

  destination:
    server: https://kubernetes.default.svc
    namespace: commerce

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Migration Job is a pre-upgrade Helm hook; let ArgoCD apply hooks.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
