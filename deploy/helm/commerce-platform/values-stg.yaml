# stg — Scaleway (region fr-par). Managed PostgreSQL + Managed Redis (TLS),
# images from Scaleway Container Registry, ingress via Scaleway LB + cert-manager.
# Fill the <...> placeholders from the Terraform outputs (deploy/terraform/stg).
global:
  image:
    pyRepository: rg.fr-par.scw.cloud/<registry-namespace>/commerce-platform-py
    pyTag: stg
    uiRepository: rg.fr-par.scw.cloud/<registry-namespace>/commerce-platform-ui
    uiTag: stg
    pullPolicy: IfNotPresent
  jwtExistingSecret: commerce-jwt
  postgres:
    host: <rdb-instance>.fr-par.scw.cloud # Managed PostgreSQL endpoint
    port: 5432
    user: commerce
    existingSecret: commerce-postgres
    dsnParams: "?ssl=require" # Scaleway managed PG requires TLS
  valkey:
    # Managed Redis uses TLS -> rediss://, port 6379.
    url: rediss://<redis-endpoint>.fr-par.scw.cloud:6379/0
    brokerUrl: rediss://<redis-endpoint>.fr-par.scw.cloud:6379/1
    resultBackend: rediss://<redis-endpoint>.fr-par.scw.cloud:6379/2
  otelEndpoint: ""

# Managed Postgres/Redis on Scaleway — no in-cluster demo deps.
postgres:
  enabled: false
valkey:
  enabled: false

migrations:
  enabled: true

# Expose the storefront + API through a Scaleway Load Balancer (ingress-nginx)
# with Let's Encrypt TLS via cert-manager.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: commerce-stg-tls
  hosts:
    - {host: shop.stg.example.com, service: webshop-ui, port: 8080}
    - {host: api.stg.example.com, service: webshop-api, port: 8000}

services:
  auth-api: {replicas: 2}
  backoffice-api: {replicas: 1}
  orders-api: {replicas: 2}
  webshop-api: {replicas: 2}
  worker: {replicas: 2}
  beat: {replicas: 1}
  flower: {enabled: true, replicas: 1}
  webshop-ui: {replicas: 2}

# Centralized logging. Scaleway has no managed Elasticsearch, so run a
# single-node ES (+Kibana) in-cluster for staging (size up or use ECK for prod).
elk:
  enabled: true
  inCluster: true
  indexPrefix: commerce-logs-stg
