{{- /* In-cluster single-node Elasticsearch + Kibana (demo only). For uat/stg/prd
        set elk.inCluster=false and point elk.elasticsearch.host at a managed ES. */ -}}
{{- if and .Values.elk.enabled .Values.elk.inCluster }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: elasticsearch, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: elasticsearch, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.elk.elasticsearch.image }}
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: {{ .Values.elk.elasticsearch.javaOpts | quote }}}
          ports: [{containerPort: 9200}]
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts: [{name: data, mountPath: /usr/share/elasticsearch/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: elasticsearch, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 9200, targetPort: 9200}]
{{- if .Values.elk.kibana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: kibana
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kibana, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kibana, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: kibana
          image: {{ .Values.elk.kibana.image }}
          env:
            - {name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200"}
          ports: [{containerPort: 5601}]
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: kibana, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: {{ .Values.elk.kibana.port }}, targetPort: 5601}]
{{- end }}
{{- end }}
