{{- if .Values.externalSecrets.enabled }}
{{- $root := . -}}
# Connection to the secrets backend (Doppler). The service token lives in a
# bootstrap Secret created out-of-band (the only "secret zero").
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-{{ .Values.externalSecrets.provider }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.provider "doppler" }}
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: {{ .Values.externalSecrets.tokenSecretName }}
            key: {{ .Values.externalSecrets.tokenSecretKey }}
    {{- else }}
    {{- fail (printf "unsupported externalSecrets.provider: %s" .Values.externalSecrets.provider) }}
    {{- end }}
{{- range .Values.externalSecrets.secrets }}
---
# Materializes the native Secret "{{ .name }}" that the chart consumes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "cp.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $root.Release.Name }}-{{ $root.Values.externalSecrets.provider }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef }}
    {{- end }}
{{- end }}
{{- end }}
