{{- /* Only create a Secret when the user did not point at an existing one. */ -}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "commerce-platform.fullname" . }}
  labels:
    {{- include "commerce-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.existingSecretPasswordKey }}: {{ .Values.postgres.password | quote }}
{{- end }}
