{{- /* In-cluster Postgres + Valkey for demos. Disable and point global.* at
        managed instances for production. */ -}}
{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.global.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.pgSecretName" . }}
                  key: {{ .Values.global.postgres.existingSecretPasswordKey }}
            - name: POSTGRES_DB
              value: commerce
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap: {name: {{ .Release.Name }}-pg-init}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pg-init
  labels:
    {{- include "cp.labels" . | nindent 4 }}
data:
  init.sql: |
    {{- range .Values.postgres.databases }}
    CREATE DATABASE {{ . }};
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 5432, targetPort: 5432}]
{{- end }}
{{- if .Values.valkey.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: valkey, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: valkey, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["--port", "6380"]
          ports: [{containerPort: 6380}]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: valkey, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 6380, targetPort: 6380}]
{{- end }}
