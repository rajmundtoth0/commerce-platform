{{- if .Values.migrations.enabled }}
{{- $root := . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.global.image.pyRepository }}:{{ .Values.global.image.pyTag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # Run Alembic for each owning database in turn.
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cd apps/auth-api && POSTGRES_DSN="{{ include "cp.dsn" (list "auth" $root) }}" alembic upgrade head && cd /app
              cd apps/orders-api && POSTGRES_DSN="{{ include "cp.dsn" (list "orders" $root) }}" alembic upgrade head && cd /app
              cd apps/backoffice-api && POSTGRES_DSN="{{ include "cp.dsn" (list "backoffice" $root) }}" alembic upgrade head
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.pgSecretName" . }}
                  key: {{ .Values.global.postgres.existingSecretPasswordKey }}
          resources:
            {{- toYaml .Values.defaults.resources | nindent 12 }}
{{- end }}
