# commerce-platform Helm values.
#
# One chart deploys every service. The `services` map is the source of truth for
# what gets deployed; each entry renders a Deployment (+ Service if it exposes a
# port). Postgres and Valkey can be deployed in-cluster for demos or pointed at
# managed instances via `global.postgres` / `global.valkey`.

global:
  image:
    # Python services share one image; the UI has its own.
    pyRepository: ghcr.io/your-org/commerce-platform-py
    pyTag: "0.2.0"
    uiRepository: ghcr.io/your-org/commerce-platform-ui
    uiTag: "0.2.0"
    pullPolicy: IfNotPresent
  # Shared JWT secret (auth-api issues, everyone verifies). Use existingSecret in prod.
  jwtSecret: "dev-secret-change-me-in-production-0123456789"
  jwtExistingSecret: "" # name of a Secret with key JWT_SECRET
  valkey:
    url: redis://valkey:6380/0
    brokerUrl: redis://valkey:6380/1
    resultBackend: redis://valkey:6380/2
  postgres:
    host: postgres
    port: 5432
    user: commerce
    password: commerce
    existingSecret: "" # name of a Secret with key POSTGRES_PASSWORD
    existingSecretPasswordKey: POSTGRES_PASSWORD
    dsnParams: "" # appended to every DSN, e.g. "?ssl=require" for managed TLS
  otelEndpoint: "" # e.g. http://otel-collector.observability:4317

# Convenience in-cluster dependencies (NOT production-grade — use a managed DB/Valkey in prod).
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  databases: [auth, orders, backoffice]
valkey:
  enabled: true
  image: valkey/valkey:8-alpine

# Centralized logging: Filebeat (DaemonSet) ships the services' structured JSON
# logs to Elasticsearch; explore in Kibana. Off by default.
elk:
  enabled: false
  # inCluster: deploy a single-node Elasticsearch (+Kibana) in the cluster (demo).
  # Set false to ship to a managed/external Elasticsearch (elasticsearch.host).
  inCluster: false
  indexPrefix: commerce-logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    host: elasticsearch # external host when inCluster=false
    port: 9200
    javaOpts: "-Xms512m -Xmx512m"
  kibana:
    enabled: true
    image: docker.elastic.co/kibana/kibana:8.15.3
    port: 5601
  filebeat:
    enabled: true
    image: docker.elastic.co/beats/filebeat:8.15.3

# Run Alembic migrations for each owning database as a pre-install/upgrade Job.
migrations:
  enabled: true

# External Secrets Operator (ESO): sync secrets from a backend (Doppler) into the
# native k8s Secrets the chart already consumes via `existingSecret`. Off by
# default; when enabled, set global.jwtExistingSecret / global.postgres.existingSecret
# to the names below so the chart does NOT also create them.
# Requires: ESO installed in-cluster + a bootstrap token Secret (tokenSecretName).
externalSecrets:
  enabled: false
  provider: doppler
  refreshInterval: 1h
  tokenSecretName: doppler-token # bootstrap Secret holding the Doppler service token
  tokenSecretKey: dopplerToken
  # k8s Secrets to materialize (names must match the chart's existingSecret refs).
  secrets:
    - name: commerce-jwt
      data:
        - { secretKey: JWT_SECRET, remoteRef: JWT_SECRET }
    - name: commerce-postgres
      data:
        - { secretKey: POSTGRES_PASSWORD, remoteRef: POSTGRES_PASSWORD }

# stakater/reloader: rolling-restart workloads when their Secret changes (e.g. a
# Doppler rotation synced by ESO). Adds reload annotations to the Deployments.
# Requires the reloader controller installed in-cluster.
reloader:
  enabled: false

# External access. Off by default (local/kind use port-forward); enabled per env
# for cloud clusters. Each host routes to a service:port (e.g. UI + API).
ingress:
  enabled: false
  className: nginx
  annotations: {}
  tls:
    enabled: true
    secretName: "" # defaults to <release>-tls
  hosts: []
  # Example (set in an env overlay):
  # hosts:
  #   - {host: shop.stg.example.com, service: webshop-ui, port: 8080}
  #   - {host: api.stg.example.com, service: webshop-api, port: 8000}

defaults:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  probes:
    liveness: {path: /health, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
    readiness: {path: /ready, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}

services:
  auth-api:
    type: api
    command: ["uvicorn", "auth_api.main:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers"]
    port: 8002
    replicas: 2
    db: auth # -> POSTGRES_DSN for the `auth` database

  backoffice-api:
    type: api
    command: ["uvicorn", "backoffice_api.main:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers"]
    port: 8001
    replicas: 1
    db: backoffice

  orders-api:
    type: api
    command: ["uvicorn", "orders_api.main:app", "--host", "0.0.0.0", "--port", "8003", "--proxy-headers"]
    port: 8003
    replicas: 2
    db: orders

  webshop-api:
    type: api
    command: ["uvicorn", "webshop_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    port: 8000
    replicas: 2
    extraEnv:
      ORDERS_API_URL: http://orders-api:8003

  worker:
    type: worker
    command: ["celery", "-A", "worker.celery_app", "worker", "-l", "info", "--concurrency=4"]
    replicas: 2
    metricsPort: 9100
    dbEnvs:
      BACKOFFICE_POSTGRES_DSN: backoffice
      ORDERS_POSTGRES_DSN: orders

  beat:
    type: worker
    # Schedule + pidfile go to /tmp (the container runs as a non-root user that
    # can't write the working directory).
    command: ["celery", "-A", "worker.celery_app", "beat", "-l", "info",
              "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    replicas: 1 # exactly one scheduler
    dbEnvs:
      BACKOFFICE_POSTGRES_DSN: backoffice
      ORDERS_POSTGRES_DSN: orders

  flower:
    type: flower
    command: ["celery", "-A", "worker.celery_app", "flower", "--port=5555"]
    port: 5555
    replicas: 1
    enabled: true

  webshop-ui:
    type: ui
    port: 8080 # nginx-unprivileged listens on 8080
    runAsUser: 101 # the nginx-unprivileged image's user (owns its cache dirs)
    replicas: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
