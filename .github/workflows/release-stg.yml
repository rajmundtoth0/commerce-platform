name: Release to staging (Scaleway)

# Manual, opt-in: builds the images and pushes them to the Scaleway Container
# Registry with the `stg` tag. ArgoCD (deploy/argocd/stg.yaml) then syncs.
#
# Requires repo secrets:
#   SCW_SECRET_KEY        - Scaleway API secret key (registry write)
#   SCW_REGISTRY_ENDPOINT - e.g. rg.fr-par.scw.cloud/commerce-stg
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "stg"
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python
          push: true
          tags: ${{ vars.SCW_REGISTRY_ENDPOINT }}/commerce-platform-py:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          push: true
          tags: ${{ vars.SCW_REGISTRY_ENDPOINT }}/commerce-platform-ui:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
