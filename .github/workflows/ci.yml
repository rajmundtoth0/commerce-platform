name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install (single dist, all services + platform)
        run: uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check apps libs tests
      - name: Ruff format check
        run: ruff format --check apps libs tests
      - name: mypy (strict)
        run: mypy apps libs
      - name: Tests (hermetic — SQLite + fakeredis)
        run: pytest

  ui:
    name: webshop-ui build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webshop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/webshop-ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/commerce-platform
      - run: helm template commerce deploy/helm/commerce-platform > /dev/null

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Python image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python
          push: false
          tags: commerce-platform-py:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          push: false
          tags: commerce-platform-ui:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
