name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Create venv + put it on PATH
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install (single dist, all services + platform)
        run: uv pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check apps libs tests
      - name: Ruff format check
        run: ruff format --check apps libs tests
      - name: mypy (strict)
        run: mypy apps libs
      - name: Tests (hermetic — SQLite + fakeredis)
        run: pytest

  ui:
    name: webshop-ui build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webshop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/webshop-ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/commerce-platform
      - run: helm template commerce deploy/helm/commerce-platform > /dev/null

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Python image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python
          push: false
          tags: commerce-platform-py:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          push: false
          tags: commerce-platform-ui:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-smoke:
    name: kind deploy smoke test
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (local tags)
        run: |
          docker build -f docker/Dockerfile.python -t commerce-platform-py:local .
          docker build -f docker/Dockerfile.ui -t commerce-platform-ui:local .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: commerce
      - name: Load images into kind
        run: |
          kind load docker-image commerce-platform-py:local --name commerce
          kind load docker-image commerce-platform-ui:local --name commerce
      - name: Helm install (dev values)
        # ELK (in-cluster Elasticsearch+Kibana) is disabled for the smoke test —
        # it's heavy/slow to become ready on a 2-CPU runner and isn't what this
        # job verifies (chart deploys + service /health). ELK is exercised via
        # docker compose --profile elk instead.
        run: |
          helm upgrade --install commerce deploy/helm/commerce-platform \
            --namespace commerce-dev --create-namespace \
            -f deploy/helm/commerce-platform/values.yaml \
            -f deploy/helm/commerce-platform/values-dev.yaml \
            --set elk.enabled=false \
            --wait --timeout 8m
      - name: Smoke test /health across services
        run: |
          kubectl -n commerce-dev get pods
          kubectl -n commerce-dev run smoke --image=curlimages/curl:8.11.0 \
            --restart=Never -i --rm --quiet --command -- \
            sh -ec 'for s in webshop-api:8000 auth-api:8002 orders-api:8003 backoffice-api:8001 status-api:8004; do
              curl -fsS "http://${s%%:*}:${s##*:}/health" && echo " ok ${s}"; done'
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n commerce-dev get pods -o wide || true
          kubectl -n commerce-dev get jobs || true
          kubectl -n commerce-dev logs -l app.kubernetes.io/name=migrate --tail=80 || true
          kubectl -n commerce-dev describe pods || true
