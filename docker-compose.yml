# Local development stack for the whole platform.
#
#   docker compose up --build
#   UI:        http://localhost:5173
#   webshop:   http://localhost:8000/docs
#   backoffice http://localhost:8001/docs  (SQLAdmin at /admin/db)
#   auth:      http://localhost:8002/docs
#   orders:    http://localhost:8003/docs
#   flower:    http://localhost:5555
#
name: commerce-platform

x-python-build: &python-build
  build:
    context: .
    dockerfile: docker/Dockerfile.python
  image: commerce-platform-py:local

x-common-env: &common-env
  APP_ENV: local
  LOG_LEVEL: INFO
  JWT_SECRET: dev-secret-change-me-in-production-0123456789
  VALKEY_URL: redis://valkey:6380/0
  CELERY_BROKER_URL: redis://valkey:6380/1
  CELERY_RESULT_BACKEND: redis://valkey:6380/2
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

services:
  # --- Infrastructure ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--port", "6380", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  # --- One-shot migrations (one per owning database) ---------------------
  migrate-auth:
    <<: *python-build
    command: ["sh", "-c", "cd apps/auth-api && alembic upgrade head && python -m auth_api.seed"]
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/auth
    depends_on:
      postgres: {condition: service_healthy}

  migrate-orders:
    <<: *python-build
    command: ["sh", "-c", "cd apps/orders-api && alembic upgrade head"]
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/orders
    depends_on:
      postgres: {condition: service_healthy}

  migrate-backoffice:
    <<: *python-build
    command: ["sh", "-c", "cd apps/backoffice-api && alembic upgrade head"]
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/backoffice
    depends_on:
      postgres: {condition: service_healthy}

  # --- Services ----------------------------------------------------------
  auth-api:
    <<: *python-build
    command: ["uvicorn", "auth_api.main:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers"]
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/auth
    ports: ["8002:8002"]
    depends_on:
      valkey: {condition: service_healthy}
      migrate-auth: {condition: service_completed_successfully}

  backoffice-api:
    <<: *python-build
    command: ["uvicorn", "backoffice_api.main:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers"]
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/backoffice
    ports: ["8001:8001"]
    depends_on:
      valkey: {condition: service_healthy}
      migrate-backoffice: {condition: service_completed_successfully}

  orders-api:
    <<: *python-build
    command: ["uvicorn", "orders_api.main:app", "--host", "0.0.0.0", "--port", "8003", "--proxy-headers"]
    environment:
      <<: *common-env
      POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/orders
    ports: ["8003:8003"]
    depends_on:
      valkey: {condition: service_healthy}
      migrate-orders: {condition: service_completed_successfully}

  webshop-api:
    <<: *python-build
    command: ["uvicorn", "webshop_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      <<: *common-env
      ORDERS_API_URL: http://orders-api:8003
    ports: ["8000:8000"]
    depends_on:
      valkey: {condition: service_healthy}
      orders-api: {condition: service_started}

  # --- Worker / scheduler / monitoring -----------------------------------
  worker:
    <<: *python-build
    command: ["celery", "-A", "worker.celery_app", "worker", "-l", "info", "--concurrency=2"]
    environment:
      <<: *common-env
      BACKOFFICE_POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/backoffice
      ORDERS_POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/orders
    depends_on:
      valkey: {condition: service_healthy}
      migrate-backoffice: {condition: service_completed_successfully}
      migrate-orders: {condition: service_completed_successfully}

  beat:
    <<: *python-build
    command: ["celery", "-A", "worker.celery_app", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    environment:
      <<: *common-env
      BACKOFFICE_POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/backoffice
      ORDERS_POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/orders
    depends_on:
      valkey: {condition: service_healthy}

  flower:
    <<: *python-build
    command: ["celery", "-A", "worker.celery_app", "flower", "--port=5555"]
    environment:
      <<: *common-env
      BACKOFFICE_POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/backoffice
      ORDERS_POSTGRES_DSN: postgresql+asyncpg://commerce:commerce@postgres:5432/orders
    ports: ["5555:5555"]
    depends_on:
      valkey: {condition: service_healthy}

  # --- Frontend ----------------------------------------------------------
  webshop-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    image: commerce-platform-ui:local
    ports: ["5173:8080"]
    depends_on:
      webshop-api: {condition: service_started}

  # --- ELK (opt-in: `docker compose --profile elk up`) -------------------
  # Ships the services' structured JSON logs to Elasticsearch; explore in Kibana.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["elk"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    # Host port 9201 (9200 is commonly taken); container/internal stays 9200.
    ports: ["9201:9200"]
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '(green|yellow)'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["elk"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    # Host port 5602 (5601 is commonly taken); container/internal stays 5601.
    ports: ["5602:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    profiles: ["elk"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./infra/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch: {condition: service_healthy}

volumes:
  pgdata:
  esdata:
